<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatMyIdeas — Blog Digital Twin</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3352;
      --accent: #6c8ef7;
      --accent-dark: #4a6cf7;
      --text: #e2e8f0;
      --text-muted: #8892b0;
      --user-bubble: #2d3a6e;
      --bot-bubble: #1e2438;
      --error: #f87171;
      --success: #4ade80;
      --radius: 12px;
      --radius-sm: 8px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ──────────────────────────────────────────────────────────── */
    header {
      padding: 12px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .logo { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.5px; }
    .logo span { color: var(--accent); }
    .header-sub { font-size: 0.75rem; color: var(--text-muted); }
    .status-pill {
      margin-left: auto;
      padding: 3px 10px;
      border-radius: 99px;
      font-size: 0.7rem;
      font-weight: 600;
      background: var(--surface2);
      color: var(--text-muted);
      border: 1px solid var(--border);
      display: flex; align-items: center; gap: 5px;
    }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-muted); }
    .status-dot.ok { background: var(--success); }

    /* ── Main layout ──────────────────────────────────────────────────────── */
    main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* ── Sidebar ─────────────────────────────────────────────────────────── */
    aside {
      width: 300px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }
    .sidebar-section {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-section h3 {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    /* Ingest form */
    .ingest-url {
      width: 100%;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 6px;
    }
    .ingest-url:focus { border-color: var(--accent); }
    .ingest-url::placeholder { color: var(--text-muted); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 7px 14px;
      border-radius: var(--radius-sm);
      border: none;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:hover:not(:disabled) { opacity: 0.9; }
    .btn:active:not(:disabled) { transform: scale(0.97); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: #fff; }
    #ingest-btn  { width: 100%; }
    .btn-danger  { background: #7f1d1d; color: #fca5a5; padding: 4px 8px; font-size: 0.75rem; }
    .btn-ghost   { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }

    /* Blog list */
    .blog-list { flex: 1; overflow-y: auto; }
    .blog-item {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s;
      display: flex; align-items: flex-start; justify-content: space-between; gap: 6px;
    }
    .blog-item:hover { background: var(--surface2); }
    .blog-item.active { background: var(--surface2); border-left: 3px solid var(--accent); padding-left: 13px; }
    .blog-meta { min-width: 0; }
    .blog-item-title { font-size: 0.82rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .blog-item-sub { font-size: 0.7rem; color: var(--text-muted); margin-top: 2px; }
    .blog-item-authors { font-size: 0.68rem; color: var(--accent); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Author select */
    .author-select {
      width: 100%;
      padding: 7px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.82rem;
      outline: none;
    }
    .author-select:focus { border-color: var(--accent); }

    /* ── Chat area ───────────────────────────────────────────────────────── */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Empty state */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      color: var(--text-muted);
      text-align: center;
      padding: 40px;
    }
    .empty-icon { font-size: 3rem; }
    .empty-state h2 { font-size: 1.2rem; color: var(--text); }
    .empty-state p  { font-size: 0.85rem; max-width: 360px; line-height: 1.6; }

    /* Messages */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .message { display: flex; gap: 10px; align-items: flex-start; max-width: 100%; }
    .message.user  { flex-direction: row-reverse; }
    .avatar {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.9rem; flex-shrink: 0;
    }
    .message.user  .avatar { background: var(--accent-dark); }
    .message.bot   .avatar { background: var(--surface2); border: 1px solid var(--border); }
    .bubble {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: 0.88rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .message.user .bubble { background: var(--user-bubble); border-radius: var(--radius) 4px var(--radius) var(--radius); }
    .message.bot  .bubble { background: var(--bot-bubble); border-radius: 4px var(--radius) var(--radius) var(--radius); border: 1px solid var(--border); }
    .sources {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      font-size: 0.72rem;
      color: var(--text-muted);
    }
    .sources a { color: var(--accent); text-decoration: none; margin-left: 4px; }
    .sources a:hover { text-decoration: underline; }

    /* Typing indicator */
    .typing .bubble { padding: 12px 16px; }
    .typing-dots { display: flex; gap: 4px; align-items: center; }
    .typing-dots span {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--text-muted);
      animation: bounce 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.7); opacity: 0.5; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* Progress bar */
    .progress-bar-wrap { padding: 0 16px 10px; }
    .progress-bar {
      height: 3px; background: var(--border); border-radius: 99px; overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%; background: var(--accent);
      animation: indeterminate 1.5s infinite;
    }
    @keyframes indeterminate {
      0%   { transform: translateX(-100%); width: 50%; }
      100% { transform: translateX(250%);  width: 50%; }
    }

    /* Input row */
    .input-row {
      display: flex;
      gap: 8px;
      padding: 12px 24px 16px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }
    #message-input {
      flex: 1;
      resize: none;
      min-height: 42px;
      max-height: 120px;
      padding: 10px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.88rem;
      line-height: 1.5;
      outline: none;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    #message-input:focus { border-color: var(--accent); }
    #message-input::placeholder { color: var(--text-muted); }
    #message-input:disabled { opacity: 0.5; }
    #send-btn { padding: 10px 14px; font-size: 1rem; align-self: flex-end; flex-shrink: 0; width: auto; }

    /* Toast */
    #toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      padding: 10px 20px; border-radius: var(--radius);
      font-size: 0.82rem; font-weight: 600;
      background: var(--surface2); border: 1px solid var(--border);
      opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 999;
    }
    #toast.show { opacity: 1; }
    #toast.error { border-color: var(--error); color: var(--error); }
    #toast.success { border-color: var(--success); color: var(--success); }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
  </style>
</head>
<body>

<header>
  <div>
    <div class="logo">Chat<span>MyIdeas</span></div>
    <div class="header-sub">Blog Digital Twin</div>
  </div>
  <div class="status-pill" id="status-pill">
    <div class="status-dot" id="status-dot"></div>
    <span id="status-text">checking…</span>
  </div>
</header>

<main>
  <!-- Sidebar -->
  <aside>
    <!-- Ingest section -->
    <div class="sidebar-section">
      <h3>Add Blog</h3>
      <input class="ingest-url" id="blog-url-input" type="url"
             placeholder="https://example.com/blog" autocomplete="off" />
      <button class="btn btn-primary" id="ingest-btn">⚡ Create Twin</button>
      <div id="ingest-progress" style="display:none; margin-top:8px;">
        <div class="progress-bar"><div class="progress-bar-fill"></div></div>
        <div style="font-size:0.7rem;color:var(--text-muted);margin-top:4px;text-align:center;">Ingesting articles…</div>
      </div>
    </div>

    <!-- Author filter -->
    <div class="sidebar-section" id="author-section" style="display:none;">
      <h3>Author</h3>
      <select class="author-select" id="author-select">
        <option value="">All authors</option>
      </select>
    </div>

    <!-- Blog list -->
    <div class="blog-list" id="blog-list"></div>
  </aside>

  <!-- Chat area -->
  <div class="chat-area" id="chat-area">
    <div class="empty-state" id="empty-state">
      <div class="empty-icon">🧠</div>
      <h2>Start chatting with a digital twin</h2>
      <p>Paste a blog URL in the sidebar and click <strong>Create Twin</strong>.
         ChatMyIdeas will read all articles and let you have a conversation with the author's ideas.</p>
    </div>
    <!-- Messages will be injected here by JS -->
  </div>
</main>

<div id="toast"></div>

<script>
const API = '/api/v1';
let activeBlogId = null;
let history = [];

// ── DOM refs ──────────────────────────────────────────────────────────────────
const blogUrlInput = document.getElementById('blog-url-input');
const ingestBtn    = document.getElementById('ingest-btn');
const ingestProg   = document.getElementById('ingest-progress');
const blogList     = document.getElementById('blog-list');
const chatArea     = document.getElementById('chat-area');
const emptyState   = document.getElementById('empty-state');
const authorSec    = document.getElementById('author-section');
const authorSel    = document.getElementById('author-select');
const statusPill   = document.getElementById('status-pill');
const statusDot    = document.getElementById('status-dot');
const statusText   = document.getElementById('status-text');

// ── Health check ──────────────────────────────────────────────────────────────
async function checkHealth() {
  try {
    const r = await fetch(`${API}/health`);
    const d = await r.json();
    if (d.ollama_available) {
      statusDot.className = 'status-dot ok';
      statusText.textContent = `Ollama · ${d.model}`;
    } else {
      statusDot.className = 'status-dot';
      statusText.textContent = `Ollama offline`;
    }
  } catch {
    statusDot.className = 'status-dot';
    statusText.textContent = 'API offline';
  }
}

// ── Blog list ─────────────────────────────────────────────────────────────────
async function loadBlogs() {
  try {
    const r = await fetch(`${API}/blogs`);
    const blogs = await r.json();
    blogList.innerHTML = '';
    blogs.forEach(b => {
      const el = document.createElement('div');
      el.className = 'blog-item' + (b.id === activeBlogId ? ' active' : '');
      el.dataset.id = b.id;
      el.innerHTML = `
        <div class="blog-meta" style="min-width:0;flex:1;">
          <div class="blog-item-title" title="${esc(b.title)}">${esc(b.title)}</div>
          <div class="blog-item-sub">${b.article_count} articles</div>
          ${b.authors.length ? `<div class="blog-item-authors">✍ ${esc(b.authors.join(', '))}</div>` : ''}
        </div>
        <button class="btn btn-danger del-btn" data-id="${b.id}" title="Delete">✕</button>
      `;
      el.querySelector('.blog-meta').addEventListener('click', () => selectBlog(b));
      el.querySelector('.del-btn').addEventListener('click', async (e) => {
        e.stopPropagation();
        await deleteBlog(b.id, el);
      });
      blogList.appendChild(el);
    });
  } catch (e) {
    console.error(e);
  }
}

async function deleteBlog(id, el) {
  if (!confirm('Delete this blog twin?')) return;
  const r = await fetch(`${API}/blogs/${id}`, { method: 'DELETE' });
  if (r.ok || r.status === 204) {
    el.remove();
    if (activeBlogId === id) resetChat();
    toast('Blog deleted', 'success');
  }
}

// ── Select blog ───────────────────────────────────────────────────────────────
function selectBlog(b) {
  activeBlogId = b.id;
  history = [];
  document.querySelectorAll('.blog-item').forEach(el => {
    el.classList.toggle('active', el.dataset.id === b.id);
  });

  // Populate author selector
  authorSel.innerHTML = '<option value="">All authors</option>';
  (b.authors || []).forEach(a => {
    const opt = document.createElement('option');
    opt.value = a; opt.textContent = a;
    authorSel.appendChild(opt);
  });
  authorSec.style.display = b.authors.length > 1 ? '' : 'none';

  buildChatUI(b);
}

function resetChat() {
  activeBlogId = null;
  history = [];
  authorSec.style.display = 'none';
  chatArea.innerHTML = '';
  chatArea.appendChild(emptyState);
  emptyState.style.display = '';
}

// ── Chat UI ───────────────────────────────────────────────────────────────────
function buildChatUI(b) {
  chatArea.innerHTML = `
    <div id="messages"></div>
    <div class="input-row">
      <textarea id="message-input" rows="1"
        placeholder="Ask ${esc(b.authors[0] || 'the author')} anything…"></textarea>
      <button class="btn btn-primary" id="send-btn">➤</button>
    </div>
  `;

  const msgEl   = document.getElementById('messages');
  const input   = document.getElementById('message-input');
  const sendBtn = document.getElementById('send-btn');

  // Auto-resize textarea
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  sendBtn.addEventListener('click', sendMessage);

  async function sendMessage() {
    const text = input.value.trim();
    if (!text || !activeBlogId) return;

    input.value = '';
    input.style.height = 'auto';
    input.disabled = true;
    sendBtn.disabled = true;

    appendMessage(msgEl, 'user', text);

    const typingEl = appendTyping(msgEl);

    try {
      const author = authorSel.value || null;
      const payload = {
        blog_id: activeBlogId,
        message: text,
        author,
        history: history.slice(-10),   // keep last 10 turns
      };
      const r = await fetch(`${API}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      typingEl.remove();

      if (!r.ok) {
        const err = await r.json().catch(() => ({ detail: r.statusText }));
        appendMessage(msgEl, 'error', err.detail || 'Something went wrong.');
      } else {
        const d = await r.json();
        appendMessage(msgEl, 'bot', d.response, d.sources);
        history.push({ role: 'user', content: text });
        history.push({ role: 'assistant', content: d.response });
      }
    } catch (e) {
      typingEl.remove();
      appendMessage(msgEl, 'error', 'Network error: ' + e.message);
    }

    input.disabled = false;
    sendBtn.disabled = false;
    input.focus();
  }
}

// ── Message helpers ───────────────────────────────────────────────────────────
function appendMessage(container, role, text, sources) {
  const isUser = role === 'user';
  const isError = role === 'error';

  const wrap = document.createElement('div');
  wrap.className = `message ${isUser ? 'user' : 'bot'}`;

  let sourcesHTML = '';
  if (sources && sources.length) {
    const links = sources.map(s =>
      `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title || s.url)}</a>`
    ).join(' · ');
    sourcesHTML = `<div class="sources">📄 Sources: ${links}</div>`;
  }

  wrap.innerHTML = `
    <div class="avatar">${isUser ? '👤' : '🧠'}</div>
    <div class="bubble" style="${isError ? 'color:var(--error);border-color:var(--error)' : ''}">
      ${esc(text)}${sourcesHTML}
    </div>
  `;
  container.appendChild(wrap);
  container.scrollTop = container.scrollHeight;
  return wrap;
}

function appendTyping(container) {
  const wrap = document.createElement('div');
  wrap.className = 'message bot typing';
  wrap.innerHTML = `
    <div class="avatar">🧠</div>
    <div class="bubble">
      <div class="typing-dots"><span></span><span></span><span></span></div>
    </div>
  `;
  container.appendChild(wrap);
  container.scrollTop = container.scrollHeight;
  return wrap;
}

// ── Ingest ────────────────────────────────────────────────────────────────────
ingestBtn.addEventListener('click', async () => {
  const url = blogUrlInput.value.trim();
  if (!url) { toast('Please enter a blog URL', 'error'); return; }

  ingestBtn.disabled = true;
  ingestProg.style.display = '';

  try {
    const r = await fetch(`${API}/ingest`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url }),
    });
    const d = await r.json();
    if (!r.ok) { toast(d.detail || 'Ingestion failed', 'error'); return; }

    toast(`✓ ${d.article_count} articles ingested`, 'success');
    blogUrlInput.value = '';
    await loadBlogs();
    selectBlog(d);
  } catch (e) {
    toast('Network error: ' + e.message, 'error');
  } finally {
    ingestBtn.disabled = false;
    ingestProg.style.display = 'none';
  }
});

blogUrlInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') ingestBtn.click();
});

// ── Toast ─────────────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `show ${type}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = ''; }, 3500);
}

// ── Utilities ─────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Boot ──────────────────────────────────────────────────────────────────────
(async () => {
  await Promise.all([checkHealth(), loadBlogs()]);
  setInterval(checkHealth, 30000);
})();
</script>
</body>
</html>
